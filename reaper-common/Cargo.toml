[package]
name = "reaper-common"
description = "Shared types exchanged between the reaper eBPF program and reaperd"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[features]
# aya's marker trait for map keys/values. Off by default so the crate stays
# usable from the no_std eBPF side.
pod = ["dep:aya"]

[dependencies]
aya = { workspace = true, optional = true }
