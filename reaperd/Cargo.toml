[package]
name = "reaperd"
description = "Event-driven background-app enforcer daemon for Android (KernelSU)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
reaper-common = { path = "../reaper-common", features = ["pod"] }
aya.workspace = true
anyhow.workspace = true
log.workspace = true
libc.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15.1"

[dev-dependencies]
tempfile = "3.27.0"
